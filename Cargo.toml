[package]
name = "humanized-autoclicker"
version = "0.1.0"
edition = "2021"
description = "A modern humanized auto-clicker application for Linux GTK4/Libadwaita"

[dependencies]
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
relm4 = { version = "0.9", features = ["libadwaita"] }
evdev = "0.12"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
libc = "0.2.189"
